[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-ranking-azure"
version = "0.1.0"
description = "Local-first personalized real-estate retrieval and learning-to-rank platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6", "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "pyarrow>=15", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9"]
azure = ["azure-eventhub>=5.11", "azure-servicebus>=7.12", "azure-cosmos>=4.5", "azure-identity>=1.15", "azure-storage-file-datalake>=12.14", "mlflow>=2.10"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E702"]
